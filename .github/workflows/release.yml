name: Release

on:
  workflow_dispatch:

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch

    runs-on: ubuntu-latest

    environment: release

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.335.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Release gem
        uses: rubygems/release-gem@v1.4.1
